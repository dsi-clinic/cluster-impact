title: DSI CLUSTER IMPACT
email: techstaff@ds.uchicago.edu
description: >-
  Usage, capacity, and impact metrics for the University of Chicago Data
  Science Institute GPU cluster.
url: "https://cluster-impact.ds.uchicago.edu"
baseurl: ""
locale: "en-US"
repository: "dsi-clinic/cluster-impact"

markdown: kramdown
highlighter: rouge
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "default"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-include-cache

include:
  - pages
  - data

exclude:
  - collector
  - config
  - tests
  - Containerfile.collector
  - Dockerfile
  - Makefile
  - pyproject.toml
  - uv.lock
  - README.md
  - CLAUDE.md
  - vendor
  - .venv

breadcrumbs: false

header:
  og_image: /assets/images/dsi-logo.webp

footer:
  links: []

defaults:
  - scope:
      path: "pages"
      type: pages
    values:
      layout: single
      author_profile: false
      classes: [wide, left-aligned]
      hide_hero: true

sass:
  sass_dir: assets/css
  quiet_deps: true
