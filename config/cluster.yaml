# Static facts about the hardware that cannot be discovered at runtime.
#
# Live GPU/node counts are NOT set here — they are read from `sinfo` GRES at
# collect time, so this file can never silently drift from the real cluster.
# What lives here is: per-model performance and pricing constants, and the
# capacity timeline (when hardware entered and left service), which no live
# query can tell us retroactively.

# ---------------------------------------------------------------------------
# Per-model constants.
#
# tflops_* are DENSE peak tensor-core figures (no 2:4 sparsity doubling).
# Vendor sheets usually quote the sparse number first; we deliberately use the
# smaller, honest one. Recheck against the spec sheet if you change a value.
#
# TODO(bennett): confirm SXM vs PCIe variant for each model actually installed.
# The FP16 figures below assume: A40 (PCIe), A100 80GB (SXM4), L40S (PCIe),
# H100 (SXM5), H200 (SXM5). A PCIe H100 is ~756 not ~989.
# ---------------------------------------------------------------------------
gpu_models:
  a40:
    display: "NVIDIA A40"
    memory_gb: 48
    tflops_fp16_dense: 149.7
    tflops_fp8_dense: null      # no FP8 support (Ampere)
    tdp_watts: 300
  a100:
    display: "NVIDIA A100 80GB"
    memory_gb: 80
    tflops_fp16_dense: 312.0
    tflops_fp8_dense: null      # no FP8 support (Ampere)
    tdp_watts: 400
  l40s:
    display: "NVIDIA L40S"
    memory_gb: 48
    tflops_fp16_dense: 362.05
    tflops_fp8_dense: 733.0
    tdp_watts: 350
  h100:
    display: "NVIDIA H100"
    memory_gb: 80
    tflops_fp16_dense: 989.4
    tflops_fp8_dense: 1979.0
    tdp_watts: 700
  h200:
    display: "NVIDIA H200"
    memory_gb: 141
    tflops_fp16_dense: 989.4
    tflops_fp8_dense: 1979.0
    tdp_watts: 700

# ---------------------------------------------------------------------------
# Capacity timeline — absolute GPU counts in service as of each date.
#
# This is what makes historical utilization honest: the denominator for any
# given day uses only the hardware installed on that day. Without it, adding
# the r001-r003 H200 nodes would retroactively depress every past number.
#
# Each entry is a full snapshot, not a delta. The collector picks the latest
# entry whose `effective` date is <= the day being computed, and warns if the
# most recent entry disagrees with what `sinfo` reports today.
#
# TODO(bennett): these dates and counts are PLACEHOLDERS reconstructed from
# the documented "~140 GPUs" total. Replace with real procurement/Foreman
# dates before the first publish — `cli.py doctor` will flag the mismatch
# against live sinfo until the final entry is correct.
# ---------------------------------------------------------------------------
capacity_timeline:
  - effective: "2022-01-01"
    note: "PLACEHOLDER — earliest reconstructed state"
    gpus:
      a40: 24
      a100: 16
  - effective: "2023-07-01"
    note: "PLACEHOLDER — L40S addition"
    gpus:
      a40: 24
      a100: 16
      l40s: 32
  - effective: "2024-09-01"
    note: "PLACEHOLDER — H100 addition"
    gpus:
      a40: 24
      a100: 16
      l40s: 32
      h100: 40
  - effective: "2025-06-01"
    note: "PLACEHOLDER — first H200s"
    gpus:
      a40: 24
      a100: 16
      l40s: 32
      h100: 40
      h200: 28
  - effective: "2026-08-01"
    note: "r001-r003, 3x 8-way H200 (pending datacenter move + PXE)"
    gpus:
      a40: 24
      a100: 16
      l40s: 32
      h100: 40
      h200: 52

# ---------------------------------------------------------------------------
# Cloud cost-avoidance pricing.
#
# The site prints this table, its source, and its as-of date directly on the
# /value/ page. `derive.py` REFUSES to compute cost avoidance unless every
# in-service model has a price with a non-null source and asof date — an
# unsourced dollar figure on a public page is worse than no dollar figure.
# ---------------------------------------------------------------------------
cloud_pricing:
  currency: USD
  basis: "on-demand, single-GPU instance, US region, list price (no committed-use or spot discount)"
  # TODO(bennett): pick the provider you want to be compared against, fill in
  # real quoted rates, set source + asof, then delete this TODO.
  source: null        # e.g. "https://aws.amazon.com/ec2/pricing/on-demand/"
  asof: null          # e.g. "2026-07-28"
  usd_per_gpu_hour:
    a40: null
    a100: null
    l40s: null
    h100: null
    h200: null

# ---------------------------------------------------------------------------
# Filesystems reported on the storage page.
# ---------------------------------------------------------------------------
filesystems:
  - name: "/net/projects"
    display: "Projects"
    host: "cluster-storage2"
    dataset: "tank/projects"
    kind: "persistent"
  - name: "/net/projects2"
    display: "Projects 2"
    host: "cluster-storage4"
    dataset: "tank/projects2"
    kind: "persistent"
  - name: "/tank/scratch"
    display: "Scratch"
    host: "cluster-storage2"
    dataset: "tank/scratch"
    kind: "scratch"
    purge_days: 60
  - name: "/tank/scratch2"
    display: "Scratch 2"
    host: "cluster-storage4"
    dataset: "tank/scratch2"
    kind: "scratch"
    purge_days: 60
