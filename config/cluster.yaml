# Static facts about the hardware that cannot be discovered at runtime.
#
# Live GPU/node counts are NOT set here — they are read from `sinfo` GRES at
# collect time, so this file can never silently drift from the real cluster.
# What lives here is: per-model performance and pricing constants, and the
# capacity timeline (when hardware entered and left service), which no live
# query can tell us retroactively.

# ---------------------------------------------------------------------------
# Per-model constants.
#
# tflops_* are DENSE peak TENSOR-CORE figures (no 2:4 sparsity doubling).
# Vendor sheets usually quote the sparse number first; we deliberately use the
# smaller, honest one. Recheck against the spec sheet if you change a value.
#
# CAREFUL — do not confuse tensor-core FP16 with vector (non-tensor) FP16.
# They differ by ~4x on Ampere. A100's vector FP16 is ~78 TFLOPS; its FP16
# TENSOR CORE figure is 312 TFLOPS, and 312 is the correct value here. This
# has been mistaken once already (imp-wmb); PCIe and SXM4 A100s share the same
# GA100 die and 108 SMs, so tensor throughput is identical across form factors
# and only TDP and sustained clocks differ.
#
# Variants MEASURED on the cluster 2026-07-29 (imp-5rj), superseding the
# earlier desk research: A40 PCIe-only, L40S PCIe-only, A100 is the 80GB PCIe
# part — and H100 and H200 are each a MIXED fleet. See the GPU VARIANT CENSUS
# block below the model list for the per-node evidence.
#
# Corrects two things that were previously asserted here and are FALSE:
#   - "H100/H200 assume SXM5" — only l001 (H100) and o001 (H200) are SXM. The
#     other 24 GPUs across those two types are NVL parts at 835.5 dense FP16.
#   - "No H200 PCIe part exists, so H200 is safe by elimination" — H200 NVL is
#     the PCIe part, it exists, and 16 of the 20 H200s here are that part.
# ---------------------------------------------------------------------------
gpu_models:
  a40:
    display: "NVIDIA A40"
    memory_gb: 48
    tflops_fp16_dense: 149.7
    tflops_fp8_dense: null      # no FP8 support (Ampere)
    tdp_watts: 300
  a100:
    display: "NVIDIA A100 80GB PCIe"
    memory_gb: 80
    tflops_fp16_dense: 312.0    # tensor core, dense. NOT the ~78 vector figure.
    tflops_fp8_dense: null      # no FP8 support (Ampere)
    tdp_watts: 300              # PCIe part; SXM4 would be 400
  l40s:
    display: "NVIDIA L40S"
    memory_gb: 48
    tflops_fp16_dense: 362.05
    tflops_fp8_dense: 733.0
    tdp_watts: 350
  # H100 and H200 are each a MIXED fleet — see the variant census below. Slurm
  # cannot distinguish the variants (gres.conf sets Type=h100 / Type=h200 for
  # every card), so these keys must stay GRES-typed: cloud-cost avoidance joins
  # sacct's `gres/gpu:h100` against cloud_pricing by exactly this key, and a
  # variant-keyed table would silently fail that join.
  #
  # Because one key must cover two parts, the value here is the LOWER (NVL) one.
  # That understates peak PFLOPS by ~1.3 (57.9 published vs 59.2 exact) and is
  # the same bias already chosen elsewhere in this file: dense over sparse,
  # understate over overstate. imp-gpx adds per-variant counts so the PFLOPS sum
  # becomes exact without breaking the pricing join.
  h100:
    display: "NVIDIA H100"
    memory_gb: 94             # NVL is 94GB; the one SXM5 node is 80GB
    tflops_fp16_dense: 835.5  # H100 NVL. SXM5 would be 989.4 — see census.
    tflops_fp8_dense: 1671.0
    tdp_watts: 400            # NVL 350-400W; the SXM5 node is 700W
  h200:
    display: "NVIDIA H200"
    memory_gb: 141
    tflops_fp16_dense: 835.5  # H200 NVL. SXM would be 989.4 — see census.
    tflops_fp8_dense: 1671.0
    tdp_watts: 600            # NVL 600W; the SXM node is 700W

# ---------------------------------------------------------------------------
# GPU VARIANT CENSUS — measured on the cluster 2026-07-29 (imp-5rj).
#
# Bennett suspected a mix and was right. Taken from `nvidia-smi --query-gpu=name`
# and, for nodes whose driver stack was broken, from PCI device IDs via lspci,
# which needs no working driver and so cannot be fooled by a mismatched NVML.
#
#   node        PCI / reported name              variant      GPUs  dense FP16
#   ----------  -------------------------------  -----------  ----  ----------
#   l001        GH100 [H100 SXM5 80GB]           H100 SXM5       4      989.4
#   m001 m002   GH100 [H100L 94GB]               H100 NVL        8      835.5
#   n001        UNKNOWN — see below              H100 ?          4      835.5*
#   o001        Device 2335 / "NVIDIA H200"      H200 SXM        4      989.4
#   p001..p003  Device 233b / "NVIDIA H200 NVL"  H200 NVL       12      835.5
#   q001        Device 233b / "NVIDIA H200 NVL"  H200 NVL        4      835.5
#
# * n001 has been DOWN+NOT_RESPONDING since 2026-07-28T14:53 (Slurm reason
#   "Not responding"), so its 4 cards could not be read. It is assumed NVL —
#   the conservative choice, and the majority part. Correct it when the node
#   returns; if it is SXM5 the exact total rises by 0.6 PFLOPS.
#
# Figures verified against NVIDIA's own H100/H200 product pages and Lenovo
# Press: NVL is 1,671 teraFLOPS "with sparsity" => 835.5 dense; SXM is 1,979
# sparse => 989.4 dense. NOTE: Lenovo lp1732 lists H100 NVL as 1,980 sparse,
# which contradicts NVIDIA's own page (1,671). NVIDIA's figure is used.
#
# Exact per-variant total: 59.2 PFLOPS. Published (conservative): 57.9.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Capacity timeline — absolute GPU counts in service as of each date.
#
# This is what makes historical utilization honest: the denominator for any
# given day uses only the hardware installed on that day. Without it, adding
# the r001-r003 H200 nodes would retroactively depress every past number.
#
# Each entry is a full snapshot, not a delta. The collector picks the latest
# entry whose `effective` date is <= the day being computed, and warns if the
# most recent entry disagrees with what `sinfo` reports today.
#
# Reconstructed 2026-07-29 (imp-sed) from the earlier of each node's first DNS
# record (dns repo, master/ds.uchicago.edu) and its first Puppet hiera file
# (puppet-modules). The node -> GPU-model mapping comes from Slurm gres.conf in
# puppet-modules, which is authoritative. Every entry cites its evidence.
#
# Note: puppet-modules also contains common-19.yaml / common-23.yaml describing
# an OLDER cluster (a001-a006 RTX2080Ti, b001-b003 A40). Those predate this
# cluster and are deliberately excluded.
# ---------------------------------------------------------------------------
capacity_timeline:
  - effective: "2022-07-28"
    note: "g001-g010 (A40). DNS e43c02c 'Add private network for DS cluster nodes'."
    gpus:
      a40: 40                   # g001-g010, 10 x 4
  - effective: "2022-11-22"
    note: "h001-h002 (A100) join. DNS 2cabdb5."
    gpus:
      a40: 40
      a100: 8                   # h001+h002, 2 x 4
  - effective: "2023-06-14"
    note: "j001-ds..j004-ds (8-way A100) join. DNS 2285ce1."
    gpus:
      a40: 40
      a100: 40                  # h001-h002 (8) + j001..j004 (32)
  - effective: "2023-07-14"
    note: "j005-ds (8-way A100) joins. DNS 7951fd5."
    gpus:
      a40: 40
      a100: 48
  - effective: "2024-03-14"
    note: "k001-k003 (L40S) join. DNS e7ed69f."
    gpus:
      a40: 40
      a100: 48
      l40s: 12                  # k001-k003, 3 x 4
  - effective: "2024-03-28"
    note: "i001-ds (8-way A100) joins. DNS 4d75747 'Rename i001 for RT#398467'."
    gpus:
      a40: 40
      a100: 56
      l40s: 12
  - effective: "2024-04-02"
    note: "l001 (H100) joins. DNS e86dfd6."
    gpus:
      a40: 40
      a100: 56
      l40s: 12
      h100: 4
  - effective: "2024-06-21"
    note: "g002 GPUs swapped A40 -> A100. puppet-modules common.yaml 2f7ce749."
    gpus:
      a40: 36                   # g002's 4 leave the A40 pool
      a100: 60                  # and join the A100 pool
      l40s: 12
      h100: 4
  - effective: "2024-07-24"
    note: "m001-m002 (H100) join. Puppet hiera 2024-07-24; DNS b405aad 07-31."
    gpus:
      a40: 36
      a100: 60
      l40s: 12
      h100: 12
  - effective: "2024-11-01"
    note: "n001 (H100) joins. Puppet hiera 2024-11-01; DNS d1b0082 11-12."
    gpus:
      a40: 36
      a100: 60
      l40s: 12
      h100: 16
  - effective: "2025-08-18"
    note: "o001 (H200) joins. Puppet hiera 2025-08-18; DNS f2fe38a 08-22."
    gpus:
      a40: 36
      a100: 60
      l40s: 12
      h100: 16
      h200: 4
  - effective: "2025-08-21"
    note: "p001-p003 (H200) join. Puppet hiera 2025-08-21."
    gpus:
      a40: 36
      a100: 60
      l40s: 12
      h100: 16
      h200: 16
  - effective: "2025-09-18"
    note: "q001 (H200) joins. Puppet hiera 2025-09-18; DNS 2013509 09-22."
    gpus:
      a40: 36
      a100: 60
      l40s: 12
      h100: 16
      h200: 20
  # THIS DATE IS A DETECTION DATE, NOT A HARDWARE EVENT. g001 did not leave
  # service on 2026-07-29; that is simply when the discrepancy was found
  # (imp-5rj). slurmctld does not know the node at all -- `scontrol show node
  # g001` returns "Node g001 not found" and sinfo omits it -- even though the
  # login node's /etc/slurm/slurm.conf DOES define it and the `general`
  # partition still lists g[001-009]. So the running controller and the
  # on-disk config disagree, and when g001 actually dropped out is not
  # recoverable from config alone.
  #
  # Consequence to be aware of: days before this entry may overstate the A40
  # pool by 4 GPUs. That inflates the historical denominator, which
  # UNDERSTATES historical utilization -- the safe direction, but not exact.
  # Determining the real date needs an sacct nodelist query for g001, which is
  # expensive against slurmdbd; fold it into the imp-bba backfill rather than
  # running it standalone.
  - effective: "2026-07-29"
    note: >-
      g001 found absent from the running Slurm controller (imp-5rj), so the A40
      pool is 32, not 36, and the cluster is 140 GPUs, not 144. Detection date;
      see the comment above for why the true date is unknown.
    gpus:
      a40: 32                   # g003-g010, 8 x 4. g001 unknown to slurmctld.
      a100: 60
      l40s: 12
      h100: 16
      h200: 20                  # current state: 140 GPUs total
  # --- not yet in service -------------------------------------------------
  # g001: RESOLVED as absent — see the 2026-07-29 entry above. The running
  # controller does not know the node, so it contributes nothing. Do NOT add it
  # back on the strength of /etc/slurm/slurm.conf alone: that file defines it as
  # gpu:a100::4 while gres.conf declares Type=a40, and the two disagree. Being
  # fixed outside this repo. When it genuinely enters service, add an entry with
  # the model its gres.conf ends up declaring:
  #   - effective: "YYYY-MM-DD"      # a100 case
  #     gpus: {a40: 32, a100: 64, l40s: 12, h100: 16, h200: 20}
  #
  # r001-r003: 3x 8-way H200 = +24. DNS records exist (2026-07-27) but the
  # nodes have placeholder MACs and have not PXE-booted. Add when they enter
  # service, which takes the cluster to 164 GPUs (NOT 168 — that figure assumed
  # the phantom g001 A40s). Note these H200s' form factor is UNKNOWN and must be
  # measured like the rest; do not assume SXM:
  #   - effective: "YYYY-MM-DD"
  #     gpus: {a40: 32, a100: 60, l40s: 12, h100: 16, h200: 44}

# ---------------------------------------------------------------------------
# Cloud cost-avoidance pricing.
#
# The site prints this table, its source, and its as-of date directly on the
# /value/ page. `derive.py` REFUSES to compute cost avoidance unless every
# in-service model has a price with a non-null source and asof date — an
# unsourced dollar figure on a public page is worse than no dollar figure.
# ---------------------------------------------------------------------------
cloud_pricing:
  currency: USD
  basis: "on-demand, single-GPU instance, US region, list price (no committed-use or spot discount)"
  # Provider: CoreWeave. A40, A100 80GB PCIe, H100 PCIe rates are per-GPU
  # direct from coreweave.com/pricing/classic. L40S and H200 rates are derived
  # from 8-GPU instance prices on coreweave.com/pricing ($18.00/hr ÷ 8 and
  # $50.44/hr ÷ 8 respectively). AWS was considered but has no A40 instances.
  source: "https://www.coreweave.com/pricing/classic"
  asof: "2026-07-29"
  usd_per_gpu_hour:
    a40: 1.28     # per-GPU, coreweave.com/pricing/classic
    a100: 2.21    # 80GB PCIe, coreweave.com/pricing/classic
    l40s: 2.25    # $18.00/hr 8-GPU instance ÷ 8, coreweave.com/pricing
    h100: 4.25    # PCIe, coreweave.com/pricing/classic
    h200: 6.31    # $50.44/hr 8-GPU instance ÷ 8, coreweave.com/pricing

# ---------------------------------------------------------------------------
# Filesystems reported on the storage page.
# ---------------------------------------------------------------------------
filesystems:
  - name: "/net/projects"
    display: "Projects"
    host: "cluster-storage2"
    dataset: "tank/projects"
    kind: "persistent"
  - name: "/net/projects2"
    display: "Projects 2"
    host: "cluster-storage4"
    dataset: "tank/projects2"
    kind: "persistent"
  - name: "/tank/scratch"
    display: "Scratch"
    host: "cluster-storage2"
    dataset: "tank/scratch"
    kind: "scratch"
    purge_days: 60
  - name: "/tank/scratch2"
    display: "Scratch 2"
    host: "cluster-storage4"
    dataset: "tank/scratch2"
    kind: "scratch"
    purge_days: 60
